name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z (creates tag vX.Y.Z on the current commit)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Create tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Package
        run: scripts/package-release.sh "$VERSION"

      - name: Publish release
        run: |
          gh release create "v$VERSION" \
            ".build/release/Notchent-$VERSION.zip" \
            ".build/release/Notchent-$VERSION.zip.sha256" \
            --title "Notchent $VERSION" --generate-notes
